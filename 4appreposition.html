<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prepositions - 4AP</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f7ff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 280px);
            justify-content: center;
            gap: 60px;
            margin-top: 40px;
        }

        .card {
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            width: 280px;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .card img {
            width: 240px;
            height: 240px;
            object-fit: contain;
            border-radius: 10px;
        }

        .card h2 {
            font-size: 22px;
            margin: 15px 0;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background-color: #4a90e2;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #357abd;
        }

        .print-button {
            margin-top: 40px;
            display: inline-block;
            background-color: #4a90e2;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .print-button:hover {
            background-color: #357abd;
        }

        .back-button {
            margin-top: 20px;
            display: inline-block;
            text-decoration: none;
            background-color: #555;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
        }

        /* A4 PRINT SETTINGS */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }

            html,
            body {
                width: 210mm;
                margin: 0;
                padding: 0;
                background: white;
            }

            h1,
            .print-button,
            .back-button,
            .card button {
                display: none !important;
            }

            .cards {
                display: block;
                margin: 0;
                padding: 0;
            }

            .card {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 210mm;
                height: 297mm;
                margin: 0;
                padding: 10mm;
                box-sizing: border-box;
                background: white;
                border: none;
                border-radius: 0;
                box-shadow: none;
                page-break-after: always;
                break-after: page;
            }

            .card:last-child {
                page-break-after: auto;
                break-after: auto;
            }

            .card img {
                display: block;
                width: 100%;
                height: 100%;
                max-width: 190mm;
                max-height: 277mm;
                object-fit: contain;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <h1>Prepositions</h1>

    <div class="cards">

        <!-- Next to -->
        <div class="card">
            <img src="images/nextto.png" alt="Next to">
            
            <button onclick="speak('Next to')">Listen 🔊</button>
        </div>

        <!-- Opposite -->
        <div class="card">
            <img src="images/opposite.png" alt="Opposite">
            
            <button onclick="speak('Opposite')">Listen 🔊</button>
        </div>

        <!-- Between -->
        <div class="card">
            <img src="images/between.png" alt="Between">
            
            <button onclick="speak('Between')">Listen 🔊</button>
        </div>

        <!-- Behind -->
        <div class="card">
            <img src="images/behind.png" alt="Behind">
            
            <button onclick="speak('Behind')">Listen 🔊</button>
        </div>

        <!-- On the left -->
        <div class="card">
            <img src="images/ontheleft.png" alt="On the left">
            
            <button onclick="speak('On the left')">Listen 🔊</button>
        </div>

        <!-- On the right -->
        <div class="card">
            <img src="images/ontheright.png" alt="On the right">
            
            <button onclick="speak('On the right')">Listen 🔊</button>
        </div>

        <!-- In front of -->
        <div class="card">
            <img src="images/infrontof.png" alt="In front of">
            
            <button onclick="speak('In front of')">Listen 🔊</button>
        </div>

    </div>

    <button onclick="window.print()" class="print-button">
        🖨️ Print Flashcards
    </button>

    <br>

    <a href="4ap-sequence2.html" class="back-button">
        ← Back to Sequence 02
    </a>

    <script>
        function speak(text) {
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = "en-GB";
            speech.rate = 0.8;
            speechSynthesis.speak(speech);
        }
    </script>

</body>
</html>
