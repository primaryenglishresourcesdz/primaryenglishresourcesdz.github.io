<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>4AP - Sequence 04</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f7ff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        .resources {
            display: grid;
            grid-template-columns: repeat(2, 300px);
            justify-content: center;
            gap: 60px;
            margin-top: 40px;
        }

        .resource-card {
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            width: 300px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        .resource-card img {
            width: 250px;
            height: 250px;
            object-fit: contain;
            border-radius: 10px;
        }

        .resource-card h2 {
            font-size: 22px;
            margin: 15px 0;
        }

        .view-button {
            display: inline-block;
            text-decoration: none;
            background-color: #4a90e2;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
        }

        .back-button {
            margin-top: 40px;
            display: inline-block;
            text-decoration: none;
            background-color: #555;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h1>4AP - Sequence 04</h1>

    <div class="resources">

        <!-- Healthy Food -->
        <div class="resource-card">
            <img src="images/healthyfood.png" alt="Healthy Food">

            <h2>Healthy Food</h2>

            <a href="healthyfood.html" class="view-button">
                View Flashcards
            </a>
        </div>

        <!-- Unhealthy Food -->
        <div class="resource-card">
            <img src="images/unhealthyfood.png" alt="Unhealthy Food">

            <h2>Unhealthy Food</h2>

            <a href="unhealthyfood.html" class="view-button">
                View Flashcards
            </a>
        </div>

        <!-- Sickness and Illnesses -->
        <div class="resource-card">
            <img src="images/illnesses.png" alt="Sickness and Illnesses">

            <h2>Sickness and Illnesses</h2>

            <a href="sicknessillnesses.html" class="view-button">
                View Flashcards
            </a>
        </div>

        <!-- Body Parts -->
        <div class="resource-card">
            <img src="images/bodyy.png" alt="Body Parts">

            <h2>Body Parts</h2>

            <a href="body-parts.html" class="view-button">
                View Flashcards
            </a>
        </div>

    </div>

    <a href="4ap.html" class="back-button">
        ← Back to 4AP
    </a>

</body>
</html>
