<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farm Animals</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f7ff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 280px);
            justify-content: center;
            gap: 60px;
            margin-top: 40px;
        }

        .card {
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            width: 280px;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .card img {
            width: 240px;
            height: 240px;
            object-fit: contain;
            border-radius: 10px;
        }

        .card h2 {
            font-size: 22px;
            margin: 15px 0;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background-color: #4a90e2;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #357abd;
        }

        .print-button {
            display: block;
            margin: 40px auto 0;
        }

        .back-button {
            margin-top: 20px;
            display: inline-block;
            text-decoration: none;
            background-color: #555;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }

            body {
                margin: 0;
                padding: 0;
                background: white;
            }

            h1,
            .print-button,
            .back-button,
            .card h2,
            .card button {
                display: none !important;
            }

            .cards {
                display: block;
                margin: 0;
                padding: 0;
            }

            .card {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 210mm;
                height: 297mm;
                margin: 0;
                padding: 10mm;
                box-sizing: border-box;
                background: white;
                border: none;
                border-radius: 0;
                box-shadow: none;
                page-break-after: always;
                break-after: page;
            }

            .card:last-child {
                page-break-after: auto;
                break-after: auto;
            }

            .card img {
                display: block;
                width: 100%;
                height: 100%;
                max-width: 190mm;
                max-height: 277mm;
                object-fit: contain;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <h1>Farm Animals</h1>

    <div class="cards">

        <!-- Dog -->
        <div class="card">
            <img src="images/dog.png" alt="Dog">
            
            <button onclick="speak('Dog')">🔊 Listen</button>
        </div>

        <!-- Chicken -->
        <div class="card">
            <img src="images/chickens.png" alt="Chicken">
            
            <button onclick="speak('Chicken')">🔊 Listen</button>
        </div>

        <!-- Goat -->
        <div class="card">
            <img src="images/goat.png" alt="Goat">
            
            <button onclick="speak('Goat')">🔊 Listen</button>
        </div>

        <!-- Cow -->
        <div class="card">
            <img src="images/cow.png" alt="Cow">
            
            <button onclick="speak('Cow')">🔊 Listen</button>
        </div>

        <!-- Horse -->
        <div class="card">
            <img src="images/horse.png" alt="Horse">
            
            <button onclick="speak('Horse')">🔊 Listen</button>
        </div>

        <!-- Sheep -->
        <div class="card">
            <img src="images/sheep.png" alt="Sheep">
            
            <button onclick="speak('Sheep')">🔊 Listen</button>
        </div>

        <!-- Duck -->
        <div class="card">
            <img src="images/duck.png" alt="Duck">
            
            <button onclick="speak('Duck')">🔊 Listen</button>
        </div>

        <!-- Donkey -->
        <div class="card">
            <img src="images/donkey.png" alt="Donkey">
                        <button onclick="speak('Donkey')">🔊 Listen</button>
        </div>

        <!-- Rabbit -->
        <div class="card">
            <img src="images/rabbit.png" alt="Rabbit">
            
            <button onclick="speak('Rabbit')">🔊 Listen</button>
        </div>

        <!-- Chick -->
        <div class="card">
            <img src="images/chick.png" alt="Chick">
            
            <button onclick="speak('Chick')">🔊 Listen</button>
        </div>

    </div>

    <button class="print-button" onclick="window.print()">
        🖨️ Print Flashcards
    </button>

    <a href="4ap-sequence5.html" class="back-button">
        ← Back to Sequence 05
    </a>

    <script>
        function speak(text) {
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = "en-GB";
            speech.rate = 0.8;
            speechSynthesis.speak(speech);
        }
    </script>

</body>
</html>
