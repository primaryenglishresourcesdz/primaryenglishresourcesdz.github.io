<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Body Parts</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f7ff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 40px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 280px);
            justify-content: center;
            gap: 60px;
            margin-top: 20px;
        }

        .card {
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            width: 280px;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .card img {
            width: 240px;
            height: 240px;
            object-fit: contain;
            border-radius: 10px;
        }

        .card h2 {
            font-size: 22px;
            margin: 15px 0;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background-color: #4a90e2;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #357abd;
        }

        .print-button {
            display: block;
            margin: 40px auto 0;
        }

        .back-button {
            margin-top: 20px;
            display: inline-block;
            text-decoration: none;
            background-color: #555;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }

            body {
                margin: 0;
                padding: 0;
                background: white;
            }

            h1,
            .print-button,
            .back-button,
            .card h2,
            .card button {
                display: none !important;
            }

            .cards {
                display: block;
                margin: 0;
                padding: 0;
            }

            .card {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 210mm;
                height: 297mm;
                margin: 0;
                padding: 10mm;
                box-sizing: border-box;
                background: white;
                border: none;
                border-radius: 0;
                box-shadow: none;
                page-break-after: always;
                break-after: page;
            }

            .card:last-child {
                page-break-after: auto;
                break-after: auto;
            }

            .card img {
                display: block;
                width: 100%;
                height: 100%;
                max-width: 190mm;
                max-height: 277mm;
                object-fit: contain;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <h1>Body Parts</h1>

    <div class="cards">

        <!-- Head -->
        <div class="card">
            <img src="images/head.png" alt="Head">
            
            <button onclick="speak('Head')">🔊 Listen</button>
        </div>

        <!-- Ears -->
        <div class="card">
            <img src="images/ear.png" alt="Ears">
            
            <button onclick="speak('Ears')">🔊 Listen</button>
        </div>

        <!-- Mouth -->
        <div class="card">
            <img src="images/mouth.png" alt="Mouth">
            
            <button onclick="speak('Mouth')">🔊 Listen</button>
        </div>

        <!-- Nose -->
        <div class="card">
            <img src="images/nose.png" alt="Nose">
            
            <button onclick="speak('Nose')">🔊 Listen</button>
        </div>

        <!-- Eyes -->
        <div class="card">
            <img src="images/eyes.png" alt="Eyes">
                        <button onclick="speak('Eyes')">🔊 Listen</button>
        </div>

        <!-- Teeth -->
        <div class="card">
            <img src="images/teeth.png" alt="Teeth">
                        <button onclick="speak('Teeth')">🔊 Listen</button>
        </div>

        <!-- Hands -->
        <div class="card">
            <img src="images/hands.png" alt="Hands">
            
            <button onclick="speak('Hands')">🔊 Listen</button>
        </div>

        <!-- Shoulders -->
        <div class="card">
            <img src="images/shoulders.png" alt="Shoulders">
            
            <button onclick="speak('Shoulders')">🔊 Listen</button>
        </div>

        <!-- Toes -->
        <div class="card">
            <img src="images/toes.png" alt="Toes">
            
            <button onclick="speak('Toes')">🔊 Listen</button>
        </div>

        <!-- Feet -->
        <div class="card">
            <img src="images/feet.png" alt="Feet">
            
            <button onclick="speak('Feet')">🔊 Listen</button>
        </div>

        <!-- Knee -->
        <div class="card">
            <img src="images/knee.png" alt="Knee">
            
            <button onclick="speak('Knee')">🔊 Listen</button>
        </div>

        <!-- Legs -->
        <div class="card">
            <img src="images/legs.png" alt="Legs">
            
            <button onclick="speak('Legs')">🔊 Listen</button>
        </div>

    </div>

    <button class="print-button" onclick="window.print()">
        🖨️ Print Flashcards
    </button>

    <a href="4ap-sequence4.html" class="back-button">
        ← Back to Sequence 04
    </a>

    <script>
        function speak(text) {
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = "en-GB";
            speech.rate = 0.8;
            speechSynthesis.speak(speech);
        }
    </script>

</body>
</html>
