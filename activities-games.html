<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Activities and Games - 4AP</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f5f7ff;
        margin: 0;
        padding: 20px;
    }

    h1 {
        color: #333;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(3, 280px);
        justify-content: center;
        gap: 60px;
        margin-top: 40px;
    }

    .card {
        background-color: white;
        border-radius: 15px;
        padding: 35px 25px;
        width: 280px;
        box-sizing: border-box;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .card img {
        width: 240px;
        height: 240px;
        object-fit: contain;
        border-radius: 10px;
    }

    .card h2 {
        font-size: 22px;
        margin: 15px 0;
    }

    button {
        padding: 12px 18px;
        border: none;
        border-radius: 8px;
        background-color: #4a90e2;
        color: white;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background-color: #357abd;
    }

    .print-button {
        margin-top: 40px;
        background-color: #4a90e2;
    }

    .print-button:hover {
        background-color: #357abd;
    }

    .back-button {
        margin-top: 15px;
        display: inline-block;
        text-decoration: none;
        background-color: #555;
        color: white;
        padding: 10px 18px;
        border-radius: 8px;
    }

    @media print {
        @page {
            size: A4 portrait;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 0;
            background: white;
        }

        h1,
        .print-button,
        .back-button,
        .card h2,
        .card button {
            display: none !important;
        }

        .cards {
            display: block;
            margin: 0;
            padding: 0;
        }

        .card {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 210mm;
            height: 297mm;
            margin: 0;
            padding: 10mm;
            box-sizing: border-box;
            background: white;
            border: none;
            border-radius: 0;
            box-shadow: none;
            page-break-after: always;
            break-after: page;
        }

        .card:last-child {
            page-break-after: auto;
            break-after: auto;
        }

        .card img {
            display: block;
            width: 100%;
            height: 100%;
            max-width: 190mm;
            max-height: 277mm;
            object-fit: contain;
            border-radius: 0;
        }
    }
</style>

</head><body><h1>Activities and Games</h1>

<div class="cards">

    <!-- Hide and Seek -->
    <div class="card">
        <img src="images/hideandseek.png" alt="Hide and Seek">
        
        <button onclick="speak('Hide and Seek')">Listen 🔊</button>
    </div>

    <!-- Seesaw -->
    <div class="card">
        <img src="images/seesaw.png" alt="Seesaw">
        
        <button onclick="speak('Seesaw')">Listen 🔊</button>
    </div>

    <!-- Chess -->
    <div class="card">
        <img src="images/chess.png" alt="Chess">
        
        <button onclick="speak('Chess')">Listen 🔊</button>
    </div>

    <!-- Football -->
    <div class="card">
        <img src="images/football.png" alt="Football">
        
        <button onclick="speak('Football')">Listen 🔊</button>
    </div>

    <!-- Slide -->
    <div class="card">
        <img src="images/slide.png" alt="Slide">
        
        <button onclick="speak('Slide')">Listen 🔊</button>
    </div>

    <!-- Swing -->
    <div class="card">
        <img src="images/swing.png" alt="Swing">
        
        <button onclick="speak('Swing')">Listen 🔊</button>
    </div>

    <!-- Hopscotch -->
    <div class="card">
        <img src="images/hopscotch.png" alt="Hopscotch">
        
        <button onclick="speak('Hopscotch')">Listen 🔊</button>
    </div>

    <!-- Trampoline -->
    <div class="card">
        <img src="images/trampoine.png" alt="Trampoline">
        
        <button onclick="speak('Trampoline')">Listen 🔊</button>
    </div>

    <!-- Sudoku -->
    <div class="card">
        <img src="images/sudoku.png" alt="Sudoku">
        
        <button onclick="speak('Sudoku')">Listen 🔊</button>
    </div>

    <!-- Card Games -->
    <div class="card">
        <img src="images/cardgames.png" alt="Card Games">
        
        <button onclick="speak('Card Games')">Listen 🔊</button>
    </div>

    <!-- Video Games -->
    <div class="card">
        <img src="images/videogames.png" alt="Video Games">
        
        <button onclick="speak('Video Games')">Listen 🔊</button>
    </div>

</div>

<button class="print-button" onclick="window.print()">
    🖨️ Print Flashcards
</button>

<script>
    function speak(text) {
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang = "en-GB";
        speech.rate = 0.8;
        speechSynthesis.speak(speech);
    }
</script>

</body>
</html>
