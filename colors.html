<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3AP - Colours</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7ff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 5px;
        }

        body > p {
            margin-top: 5px;
        }

        .colors {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 30px auto;
        }

        .color-card {
            background: white;
            padding: 12px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .color-box {
            width: 270px;
            height: 270px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .color-box img {
            width: 270px;
            height: 270px;
            max-width: 100%;
            object-fit: contain;
            display: block;
        }

        h2 {
            margin: 10px 0 0;
        }

        .listen-button {
            margin-top: 10px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .listen-button:hover {
            background: #555;
        }

        .bottom-buttons {
            text-align: center;
            margin-top: 30px;
        }

        .bottom-buttons button,
        .back-button {
            display: inline-block;
            margin: 5px;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            text-decoration: none;
        }

        .back-button {
            background: #333;
            color: white;
        }

        .print-button {
            background: #4a90e2;
            color: white;
        }

        .print-button:hover {
            background: #357abd;
        }

        @media (max-width: 900px) {
            .colors {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .colors {
                grid-template-columns: 1fr;
            }
        }

        /* PRINTING */

        @media print {

            @page {
                size: A4 portrait;
                margin: 0;
            }

            body {
                background: white;
                padding: 0;
                margin: 0;
            }

            h1,
            body > p,
            .listen-button,
            .bottom-buttons,
            .color-card h2 {
                display: none;
            }

            .colors {
                display: block;
                margin: 0;
                padding: 0;
                max-width: none;
            }

            .color-card {
                width: 210mm;
                height: 297mm;
                margin: 0;
                padding: 0;

                background: white;
                border-radius: 0;
                box-shadow: none;

                display: flex;
                align-items: center;
                justify-content: center;

                page-break-after: always;
                break-after: page;
            }

            .color-card:last-child {
                page-break-after: auto;
                break-after: auto;
            }

            .color-box {
                width: 190mm;
                height: 277mm;

                display: flex;
                align-items: center;
                justify-content: center;
            }

            .color-box img {
                width: 190mm;
                height: 277mm;
                max-width: 190mm;
                max-height: 277mm;
                object-fit: contain;
            }
        }
    </style>
</head>

<body>

    <h1>🎨 Colours</h1>
    <p>Learn the names of common colours.</p>

    <div class="colors">

        <div class="color-card">
            <div class="color-box">
                <img src="images/red.png" alt="Red">
            </div>
            
            <button class="listen-button" onclick="speak('Red')">🔊 Listen</button>
        </div>

        <div class="color-card">
            <div class="color-box">
                <img src="images/blue.png" alt="Blue">
            </div>
            
            <button class="listen-button" onclick="speak('Blue')">🔊 Listen</button>
        </div>

        <div class="color-card">
            <div class="color-box">
                <img src="images/green.png" alt="Green">
            </div>
            
            <button class="listen-button" onclick="speak('Green')">🔊 Listen</button>
        </div>

        <div class="color-card">
            <div class="color-box">
                <img src="images/yellow.png" alt="Yellow">
            </div>
            
            <button class="listen-button" onclick="speak('Yellow')">🔊 Listen</button>
        </div>

        <div class="color-card">
            <div class="color-box">
                <img src="images/orannge.png" alt="Orange">
            </div>
        
            <button class="listen-button" onclick="speak('Orange')">🔊 Listen</button>
        </div>

        <div class="color-card">
            <div class="color-box">
                <img src="images/pink.png" alt="Pink">
            </div>
            
            <button class="listen-button" onclick="speak('Pink')">🔊 Listen</button>
        </div>

        <div class="color-card">
            <div class="color-box">
                <img src="images/purple.png" alt="Purple">
            </div>
            
            <button class="listen-button" onclick="speak('Purple')">🔊 Listen</button>
        </div>

        <div class="color-card">
            <div class="color-box">
                <img src="images/black.png" alt="Black">
            </div>
            
            <button class="listen-button" onclick="speak('Black')">🔊 Listen</button>
        </div>

        <div class="color-card">
            <div class="color-box">
                <img src="images/white.png" alt="White">
            </div>
            
            <button class="listen-button" onclick="speak('White')">🔊 Listen</button>
        </div>

        <div class="color-card">
            <div class="color-box">
                <img src="images/brown.png" alt="Brown">
            </div>
            
            <button class="listen-button" onclick="speak('Brown')">🔊 Listen</button>
        </div>

    </div>

    <div class="bottom-buttons">
        <a href="sequence2.html" class="back-button">← Back to Sequence 02</a>
        <button class="print-button" onclick="window.print()">🖨️ Print Flashcards</button>
    </div>

    <script>
        function speak(word) {
            const speech = new SpeechSynthesisUtterance(word);
            speech.lang = "en-GB";
            speech.rate = 0.8;

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(speech);
        }
    </script>

</body>
</html>
