<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Countries & Nationalities - 4AP</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f7ff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 340px);
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
        }

        .card {
            box-sizing: border-box;
            background-color: white;
            border-radius: 15px;
            padding: 15px;
            width: 340px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .card img {
            width: 300px;
            height: 220px;
            object-fit: contain;
            border-radius: 10px;
        }

        .card h2 {
            font-size: 20px;
            margin: 10px 0;
        }

        .card p {
            font-size: 18px;
            color: #555;
            margin: 8px 0 12px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background-color: #4a90e2;
            color: white;
            cursor: pointer;
        }

        .print-button {
            display: inline-block;
            margin: 30px 10px 0;
            padding: 12px 22px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .print-button:hover,
        .card button:hover {
            background-color: #357abd;
        }

        .back-button {
            margin: 30px auto 0;
            display: block;
            width: fit-content;
            text-decoration: none;
            background-color: #555;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
        }

        @media (max-width: 1100px) {
            .cards {
                grid-template-columns: repeat(2, 340px);
                gap: 25px;
            }
        }

        @media (max-width: 720px) {
            .cards {
                grid-template-columns: minmax(0, 340px);
                gap: 25px;
            }

            .card {
                max-width: 100%;
            }

            .card img {
                max-width: 100%;
            }
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }

            body {
                margin: 0;
                padding: 0;
                background: white;
            }

            h1,
            .card h2,
            .card p,
            .card button,
            .print-button,
            .back-button {
                display: none !important;
            }

            .cards {
                display: block;
                margin: 0;
                padding: 0;
            }

            .card {
                box-sizing: border-box;
                width: 210mm;
                height: 297mm;
                margin: 0;
                padding: 10mm;
                display: flex;
                align-items: center;
                justify-content: center;
                background: white;
                border-radius: 0;
                box-shadow: none;
                break-after: page;
                page-break-after: always;
            }

            .card:last-child {
                break-after: auto;
                page-break-after: auto;
            }

            .card img {
                display: block;
                width: 190mm;
                height: 270mm;
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <h1>Countries & Nationalities</h1>

    <div class="cards">

        <div class="card">
            <img src="images/algeria.png" alt="Algeria">
            
            <button onclick="speak('Algeria. Algerian')">Listen 🔊</button>
        </div>

        <div class="card">
            <img src="images/france.png" alt="France">
            
            <button onclick="speak('France. French')">Listen 🔊</button>
        </div>

        <div class="card">
            <img src="images/england.png" alt="England">
                        <button onclick="speak('England. English')">Listen 🔊</button>
        </div>

        <div class="card">
            <img src="images/britain.png" alt="Britain">
                        <button onclick="speak('Britain. British')">Listen 🔊</button>
        </div>

        <div class="card">
            <img src="images/usa.png" alt="The USA">
            
            <button onclick="speak('The USA. American')">Listen 🔊</button>
        </div>

        <div class="card">
            <img src="images/japan.png" alt="Japan">
            
            <button onclick="speak('Japan. Japanese')">Listen 🔊</button>
        </div>

        <div class="card">
            <img src="images/china.png" alt="China">
            
            <button onclick="speak('China. Chinese')">Listen 🔊</button>
        </div>

        <div class="card">
            <img src="images/turkey.png" alt="Turkey">
            
            <button onclick="speak('Turkey. Turkish')">Listen 🔊</button>
        </div>

        <div class="card">
            <img src="images/tunisia.png" alt="Tunisia">
                        <button onclick="speak('Tunisia. Tunisian')">Listen 🔊</button>
        </div>

        <div class="card">
            <img src="images/morocco.png" alt="Morocco">
            
            <button onclick="speak('Morocco. Moroccan')">Listen 🔊</button>
        </div>

        <div class="card">
            <img src="images/egypt.png" alt="Egypt">
            
            <button onclick="speak('Egypt. Egyptian')">Listen 🔊</button>
        </div>

        <div class="card">
            <img src="images/palestine.png" alt="Palestine">
            
            <button onclick="speak('Palestine. Palestinian')">Listen 🔊</button>
        </div>

    </div>

    <button class="print-button" onclick="window.print()">
        🖨️ Print Flashcards
    </button>

    <a href="4ap-sequence1.html" class="back-button">
        ← Back to Sequence 01
    </a>

    <script>
        function speak(text) {
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = "en-GB";
            speech.rate = 0.8;
            speechSynthesis.speak(speech);
        }
    </script>

</body>
</html>
