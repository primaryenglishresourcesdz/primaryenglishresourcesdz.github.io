<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Healthy Food</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f5f7ff;
        margin: 0;
        padding: 20px;
    }

    h1 {
        color: #333;
        margin-bottom: 40px;
    }

    h2 {
        color: #333;
        margin-top: 50px;
        margin-bottom: 25px;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(3, 280px);
        justify-content: center;
        gap: 60px;
        margin-top: 20px;
    }

    .card {
        background-color: white;
        border-radius: 15px;
        padding: 20px;
        width: 280px;
        box-sizing: border-box;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .card img {
        width: 240px;
        height: 240px;
        object-fit: contain;
        border-radius: 10px;
    }

    .card h3 {
        font-size: 22px;
        margin: 15px 0;
    }

    button {
        padding: 12px 18px;
        border: none;
        border-radius: 8px;
        background-color: #4a90e2;
        color: white;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background-color: #357abd;
    }

    .print-button {
        margin-top: 50px;
        background-color: #4a90e2;
    }

    .print-button:hover {
        background-color: #357abd;
    }

    .back-button {
        margin-top: 15px;
        display: inline-block;
        text-decoration: none;
        background-color: #555;
        color: white;
        padding: 10px 18px;
        border-radius: 8px;
    }

    @media print {
        @page {
            size: A4 portrait;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 0;
            background: white;
        }

        h1,
        h2,
        .print-button,
        .back-button,
        .card h3,
        .card button {
            display: none !important;
        }

        .cards {
            display: block;
            margin: 0;
            padding: 0;
        }

        .card {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 210mm;
            height: 297mm;
            margin: 0;
            padding: 10mm;
            box-sizing: border-box;
            background: white;
            border: none;
            border-radius: 0;
            box-shadow: none;
            page-break-after: always;
            break-after: page;
        }

        .card:last-child {
            page-break-after: auto;
            break-after: auto;
        }

        .card img {
            display: block;
            width: 100%;
            height: 100%;
            max-width: 190mm;
            max-height: 277mm;
            object-fit: contain;
            border-radius: 0;
        }
    }
</style>

<script>
    function speak(text) {
        const speech = new SpeechSynthesisUtterance(text);
