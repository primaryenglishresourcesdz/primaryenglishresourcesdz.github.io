<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>5AP - Prepositions of Place</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdf6fb;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #d63384;
            margin-bottom: 25px;
        }

        .flashcards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background-color: white;
            border-radius: 15px;
            padding: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);

            /* Keep everything vertically aligned */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card img {
            width: 270px;
            height: 270px;
            object-fit: contain;
            display: block;
        }

        .card button {
            margin-top: 10px;
        }

        button {
            background-color: #d63384;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #b02a6f;
        }

        .back-button {
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
            background-color: #d63384;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
        }

        .print-button {
            display: inline-block;
            margin: 25px 10px;
            background-color: #d63384;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .print-button:hover {
            background-color: #b02a6f;
        }

        @media (max-width: 750px) {
            .flashcards {
                grid-template-columns: repeat(2, 1fr);
            }

            .card img {
                width: 220px;
                height: 220px;
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .flashcards {
                grid-template-columns: 1fr;
            }

            .card img {
                width: 270px;
                height: 270px;
                max-width: 100%;
            }
        }

        /* A4 PRINT SETTINGS */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }

            html,
            body {
                width: 210mm;
                margin: 0;
                padding: 0;
                background: white;
            }

            h1,
            button,
            .back-button {
                display: none !important;
            }

            .flashcards {
                display: block;
                width: 210mm;
                max-width: none;
                margin: 0;
                padding: 0;
            }

            .card {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 210mm;
                height: 297mm;
                margin: 0;
                padding: 10mm;
                box-sizing: border-box;
                background: white;
                border: none;
                border-radius: 0;
                box-shadow: none;
                page-break-after: always;
                break-after: page;
            }

            .card:last-child {
                page-break-after: auto;
                break-after: auto;
            }

            .card img {
                display: block;
                width: 100%;
                height: 100%;
                max-width: 190mm;
                max-height: 277mm;
                object-fit: contain;
            }
        }
    </style>
</head>

<body>

    <h1>5AP - Prepositions of Place</h1>

    <div class="flashcards">

        <div class="card">
            <img src="images/nextto.png" alt="Next to">
            <button onclick="speak('Next to')">Listen</button>
        </div>

        <div class="card">
            <img src="images/opposite.png" alt="Opposite">
            <button onclick="speak('Opposite')">Listen</button>
        </div>

        <div class="card">
            <img src="images/between.png" alt="Between">
            <button onclick="speak('Between')">Listen</button>
        </div>

        <div class="card">
            <img src="images/behind.png" alt="Behind">
            <button onclick="speak('Behind')">Listen</button>
        </div>

        <div class="card">
            <img src="images/infrontof.png" alt="In front of">
            <button onclick="speak('In front of')">Listen</button>
        </div>

        <div class="card">
            <img src="images/ontheleft.png" alt="On the left">
            <button onclick="speak('On the left')">Listen</button>
        </div>

        <div class="card">
            <img src="images/ontheright.png" alt="On the right">
            <button onclick="speak('On the right')">Listen</button>
        </div>

    </div>

    <button class="print-button" onclick="window.print()">
        🖨️ Print Flashcards
    </button>

    <a href="5apsequence2.html" class="back-button">
        ← Back to Sequence 02
    </a>

    <script>
        function speak(text) {
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = "en-GB";
            speech.rate = 0.8;
            speechSynthesis.speak(speech);
        }
    </script>

</body>
</html>
