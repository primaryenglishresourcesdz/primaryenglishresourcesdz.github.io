<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3AP - Toys</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7ff;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #333;
        }

        .toys {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            max-width: 1000px;
            margin: 30px auto;
        }

        .toy-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .toy-card img {
            width: 250px;
            height: 220px;
            object-fit: contain;
        }

        h2 {
            margin-top: 15px;
            font-size: 22px;
        }

        .listen-button {
            margin-top: 10px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .listen-button:hover {
            background: #555;
        }

        .bottom-buttons {
            text-align: center;
            margin-top: 35px;
        }

        .back-button,
        .print-button {
            display: inline-block;
            margin: 5px;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
        }

        .back-button {
            background: #333;
            color: white;
        }

        .print-button {
            background: #4a90e2;
            color: white;
        }

        .print-button:hover {
            background: #357abd;
        }

        @media (max-width: 900px) {
            .toys {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .toys {
                grid-template-columns: 1fr;
            }
        }

        /* PRINT FLASHCARDS */

        @media print {
            @page {
                size: A4;
                margin: 0;
            }

            body {
                background: white;
                padding: 0;
                margin: 0;
            }

            h1,
            body > p,
            .listen-button,
            .bottom-buttons,
            .toy-card h2 {
                display: none;
            }

            .toys {
                display: block;
                margin: 0;
                padding: 0;
                max-width: none;
            }

            .toy-card {
                width: 210mm;
                height: 297mm;
                margin: 0;
                padding: 0;
                border: none;
                border-radius: 0;
                background: white;
                box-shadow: none;

                display: flex;
                align-items: center;
                justify-content: center;

                page-break-after: always;
                break-after: page;
            }

            .toy-card:last-child {
                page-break-after: auto;
                break-after: auto;
            }

            .toy-card img {
                width: 190mm;
                height: 270mm;
                object-fit: contain;
            }
        }
    </style>
</head>

<body>

    <h1>🧸 Toys</h1>
    <p>Learn the names of toys</p>

    <div class="toys">

        <div class="toy-card">
            <img src="images/ball.png" alt="Ball">
            
            <button class="listen-button" onclick="speak('Ball')">
                🔊 Listen
            </button>
        </div>

        <div class="toy-card">
            <img src="images/doll.png" alt="Doll">
            
            <button class="listen-button" onclick="speak('Doll')">
                🔊 Listen
            </button>
        </div>

        <div class="toy-card">
            <img src="images/robot.png" alt="Robot">
            
            <button class="listen-button" onclick="speak('Robot')">
                🔊 Listen
            </button>
        </div>

        <div class="toy-card">
            <img src="images/teddybear.png" alt="Teddy Bear">
            
            <button class="listen-button" onclick="speak('Teddy Bear')">
                🔊 Listen
            </button>
        </div>

        <div class="toy-card">
            <img src="images/kite.png" alt="Kite">
            
            <button class="listen-button" onclick="speak('Kite')">
                🔊 Listen
            </button>
        </div>

        <div class="toy-card">
            <img src="images/bike.png" alt="Bike">
            
            <button class="listen-button" onclick="speak('Bike')">
                🔊 Listen
            </button>
        </div>

        <div class="toy-card">
            <img src="images/computer.png" alt="Computer">
            
            <button class="listen-button" onclick="speak('Computer')">
                🔊 Listen
            </button>
        </div>

        <div class="toy-card">
            <img src="images/car.png" alt="Car">
            
            <button class="listen-button" onclick="speak('Car')">
                🔊 Listen
            </button>
        </div>

        <div class="toy-card">
            <img src="images/trainn.png" alt="Train">
            
            <button class="listen-button" onclick="speak('Train')">
                🔊 Listen
            </button>
        </div>

    </div>

    <div class="bottom-buttons">
        <a href="sequence4.html" class="back-button">
            ← Back to Sequence 04
        </a>

        <button class="print-button" onclick="window.print()">
            🖨️ Print Flashcards
        </button>
    </div>

    <script>
        function speak(word) {
            const speech = new SpeechSynthesisUtterance(word);
            speech.lang = "en-US";
            speechSynthesis.speak(speech);
        }
    </script>

</body>
</html>
