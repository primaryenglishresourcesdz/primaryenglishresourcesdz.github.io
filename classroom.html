<!DOCTYPE html>
<html>

<head>

    <title>Classroom Objects</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f9ff;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .object-card {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 20px;
            margin: 15px;
            width: 220px;
            display: inline-block;
            vertical-align: top;
            background-color: white;
        }

        .object-icon img {
            width: 200px;
            height: 200px;
            object-fit: contain;
        }

        .object-card h2 {
            color: #333;
            margin: 10px 0;
        }

        .listen-button {
            background-color: green;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .listen-button:hover {
            opacity: 0.8;
        }

        .bottom-buttons {
            clear: both;
            text-align: center;
            margin-top: 30px;
        }

        .bottom-buttons button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .print-button {
            background-color: #4a90e2;
            color: white;
        }

        .print-button:hover {
            background-color: #357abd;
        }


        /* PRINT VERSION */

        @media print {

            @page {
                size: A4;
                margin: 0;
            }

            body {
                background-color: white;
                padding: 0;
                margin: 0;
            }

            h1,
            .listen-button,
            .bottom-buttons,
            .object-card h2 {
                display: none;
            }

            .object-card {
                width: 210mm;
                height: 297mm;

                margin: 0;
                padding: 0;

                border: none;
                border-radius: 0;
                background-color: white;

                display: flex;
                align-items: center;
                justify-content: center;

                page-break-after: always;
                break-after: page;
            }

            .object-card:last-of-type {
                page-break-after: auto;
                break-after: auto;
            }

            .object-icon {
                width: 190mm;
                height: 270mm;

                display: flex;
                align-items: center;
                justify-content: center;
            }

            .object-icon img {
                width: 190mm;
                height: 270mm;
                object-fit: contain;
            }
        }

    </style>

</head>

<body>
