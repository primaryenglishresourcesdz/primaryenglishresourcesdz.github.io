<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sickness and Illnesses</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f5f7ff;
        margin: 0;
        padding: 20px;
    }

    h1 {
        color: #333;
        margin-bottom: 40px;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(3, 280px);
        justify-content: center;
        gap: 60px;
        margin-top: 20px;
    }

    .card {
        background-color: white;
        border-radius: 15px;
        padding: 20px;
        width: 280px;
        box-sizing: border-box;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .card img {
        width: 240px;
        height: 240px;
        object-fit: contain;
        border-radius: 10px;
    }

    .card h2 {
        font-size: 22px;
        margin: 15px 0;
    }

    button {
        padding: 12px 18px;
        border: none;
        border-radius: 8px;
        background-color: #4a90e2;
        color: white;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background-color: #357abd;
    }

    .print-button {
        margin-top: 50px;
        background-color: #4a90e2;
    }

    .print-button:hover {
        background-color: #357abd;
    }

    .back-button {
        margin-top: 15px;
        display: inline-block;
        text-decoration: none;
        background-color: #555;
        color: white;
        padding: 10px 18px;
        border-radius: 8px;
    }

    @media print {
        @page {
            size: A4 portrait;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 0;
            background: white;
        }

        h1,
        .print-button,
        .back-button,
        .card h2,
        .card button {
            display: none !important;
        }

        .cards {
            display: block;
            margin: 0;
            padding: 0;
        }

        .card {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 210mm;
            height: 297mm;
            margin: 0;
            padding: 10mm;
            box-sizing: border-box;
            background: white;
            border: none;
            border-radius: 0;
            box-shadow: none;
            page-break-after: always;
            break-after: page;
        }

        .card:last-child {
            page-break-after: auto;
            break-after: auto;
        }

        .card img {
            display: block;
            width: 100%;
            height: 100%;
            max-width: 190mm;
            max-height: 277mm;
            object-fit: contain;
            border-radius: 0;
        }
    }
</style>

</head><body><h1>Sickness and Illnesses</h1>

<div class="cards">

    <!-- Headache -->
    <div class="card">
        <img src="images/headache.png" alt="Headache">
        
        <button onclick="speak('Headache')">🔊 Listen</button>
    </div>

    <!-- Toothache -->
    <div class="card">
        <img src="images/toothache.png" alt="Toothache">
        
        <button onclick="speak('Toothache')">🔊 Listen</button>
    </div>

    <!-- Fever -->
    <div class="card">
        <img src="images/fever.png" alt="Fever">
        
        <button onclick="speak('Fever')">🔊 Listen</button>
    </div>

    <!-- Backache -->
    <div class="card">
        <img src="images/backache.png" alt="Backache">
                <button onclick="speak('Backache')">🔊 Listen</button>
    </div>

    <!-- Flu -->
    <div class="card">
        <img src="images/flu.png" alt="Flu">
        
        <button onclick="speak('Flu')">🔊 Listen</button>
    </div>

    <!-- Sore Throat -->
    <div class="card">
        <img src="images/sorethroat.png" alt="Sore Throat">
        
        <button onclick="speak('Sore Throat')">🔊 Listen</button>
    </div>

    <!-- Runny Nose -->
    <div class="card">
        <img src="images/runnynose.png" alt="Runny Nose">
                <button onclick="speak('Runny Nose')">🔊 Listen</button>
    </div>

    <!-- Cough -->
    <div class="card">
        <img src="images/cough.png" alt="Cough">
        
        <button onclick="speak('Cough')">🔊 Listen</button>
    </div>

    <!-- Stomachache -->
    <div class="card">
        <img src="images/stomacheache.png" alt="Stomachache">
        
        <button onclick="speak('Stomachache')">🔊 Listen</button>
    </div>

    <!-- Earache -->
    <div class="card">
        <img src="images/earache.png" alt="Earache">
        
        <button onclick="speak('Earache')">🔊 Listen</button>
    </div>

</div>

<button class="print-button" onclick="window.print()">
    🖨️ Print Flashcards
</button>

<script>
    function speak(text) {
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang = "en-GB";
        speech.rate = 0.8;
        speechSynthesis.speak(speech);
    }
</script>

</body>
</html>
