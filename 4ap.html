<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4th Year Primary English Resources</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f7fb;
            color: #333;
        }

        header {
            background-color: #4a90e2;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin-top: 10px;
            font-size: 17px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .sequences {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .sequence-card {
    background-color: white;
    padding: 40px 25px;
    border-radius: 15px;
    text-align: center;
    text-decoration: none;
    color: #333;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: transform 0.2s;
    min-height: 220px;
}
        .sequence-card:hover {
            transform: translateY(-5px);
        }

        .sequence-card .icon {
            font-size: 45px;
            margin-bottom: 15px;
        }
.sequence-card .icon img {
    width: 200px;
    height: 200px;
    object-fit: contain;
}
        .sequence-card h2 {
            margin: 10px 0;
            font-size: 22px;
        }

        .sequence-card p {
            color: #666;
        }

        .back-button {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            padding: 12px 22px;
            background-color: #4a90e2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 50px;
            background-color: #e9eef5;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>📗 4th Year Primary School</h1>
        <p>English Teacher Resources</p>
    </header>
