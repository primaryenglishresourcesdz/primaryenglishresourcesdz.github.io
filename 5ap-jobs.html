<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs & Workplaces</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #fff5f9;
            color: #333;
        }

        header {
            background-color: #fff0f6;
            color: #c2185b;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin-top: 10px;
            font-size: 17px;
        }

        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .flashcards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .flashcard {
            background-color: white;
            padding: 15px 15px 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            min-height: 0;
        }

        .flashcard img {
            width: 100%;
            max-width: 420px;
            height: 320px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .flashcard h2 {
            margin: 15px 0 8px;
            font-size: 24px;
        }

        .flashcard p {
            margin: 5px 0 15px;
            color: #666;
            font-size: 18px;
        }

        .listen-button {
            padding: 10px 18px;
            background-color: #e75480;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .listen-button:hover {
            background-color: #d9436f;
        }

        .back-button {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            padding: 12px 22px;
            background-color: #e75480;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .back-button:hover {
            background-color: #d9436f;
        }

        .print-button {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            padding: 12px 22px;
            background-color: #e75480;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .print-button:hover {
            background-color: #d9436f;
        }

        /* A4 PRINT SETTINGS */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }

            html,
            body {
                width: 210mm;
                margin: 0;
                padding: 0;
                background: white;
            }

            header,
            .print-button,
            .back-button,
            .listen-button,
            .flashcard h2,
            .flashcard p {
                display: none !important;
            }

            .container {
                width: 210mm;
                max-width: none;
                margin: 0;
                padding: 0;
            }

            .flashcards {
                display: block;
                margin: 0;
                padding: 0;
            }

            .flashcard {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 210mm;
                height: 297mm;
                min-height: 0;
                margin: 0;
                padding: 10mm;
                box-sizing: border-box;
                background: white;
                border: none;
                border-radius: 0;
                box-shadow: none;
                page-break-after: always;
                break-after: page;
            }

            .flashcard:last-child {
                page-break-after: auto;
                break-after: auto;
            }

            .flashcard img {
                display: block;
                width: 100%;
                height: 100%;
                max-width: 190mm;
                max-height: 277mm;
                object-fit: contain;
            }
        }
    </style>
</head>

<body>

    <header>

    </header>

    <div class="container">

        <button onclick="window.print()" class="print-button">

        <a href="5apsequence1.html" class="back-button">

    </div>

    <script>
        function speak(text) {
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = "en-GB";
            speech.rate = 0.8;
            speechSynthesis.speak(speech);
        }
    </script>

</html>
