<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greetings - Teacher Resources</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            background-color: white;
            width: 220px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 3px 10px #cccccc;
        }

        .picture {
            width: 250px;
            height: 250px;
            margin: 0 auto 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 12px;
        }

        .picture img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .word {
            font-size: 25px;
            font-weight: bold;
            margin: 10px;
        }

        .pronunciation {
            color: #666;
            margin-bottom: 15px;
        }

        button {
            border: none;
            border-radius: 20px;
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .listen {
            background-color: #4CAF50;
            color: white;
        }

        .print {
            background-color: #333;
            color: white;
            display: block;
            margin: 30px auto 10px auto;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        /* PRINT FLASHCARDS */

        @media print {
            @page {
                size: A4;
                margin: 0;
            }

            body {
                background-color: white;
                margin: 0;
                padding: 0;
            }

            h1,
            .subtitle,
            .listen,
            .print,
            .back,
            .word,
            .pronunciation {
                display: none !important;
            }

            .cards {
                display: block;
                margin: 0;
                padding: 0;
            }

            .card {
                width: 210mm;
                height: 297mm;
                margin: 0;
                padding: 0;
                border: none;
                border-radius: 0;
                box-shadow: none;
                background-color: white;

                display: flex;
                justify-content: center;
                align-items: center;

                page-break-after: always;
                break-after: page;
            }

            .card:last-child {
                page-break-after: auto;
                break-after: auto;
            }

            .picture {
                width: 190mm;
                height: 270mm;
                margin: 0;
                padding: 0;
                border-radius: 0;
                overflow: visible;
            }

            .picture img {
                width: 190mm;
                height: 270mm;
                object-fit: contain;
            }
        }
    </style>
</head>

<body>

    <h1>👋 Greetings</h1>

    <p class="subtitle">
        3AP Teacher Resource — Sequence 1
    </p>

    <div class="cards">

        <!-- Hello -->
        <div class="card">
            <div class="picture">
                <img src="./images/hello.png" alt="Hello">
            </div>

            
            <p class="pronunciation">/həˈləʊ/</p>

            <button class="listen" onclick="speak('Hello')">
                🔊 Listen
            </button>
        </div>

        <!-- Hi -->
        <div class="card">
            <div class="picture">
                <img src="./images/hi.png" alt="Hi">
            </div>

                        <p class="pronunciation">/haɪ/</p>

            <button class="listen" onclick="speak('Hi')">
                🔊 Listen
            </button>
        </div>

        <!-- Good morning -->
        <div class="card">
            <div class="picture">
                <img src="./images/goodmorning.png" alt="Good morning">
            </div>

                        <p class="pronunciation">/ɡʊd ˈmɔːrnɪŋ/</p>

            <button class="listen" onclick="speak('Good morning')">
                🔊 Listen
            </button>
        </div>

        <!-- Good afternoon -->
        <div class="card">
            <div class="picture">
                <img src="./images/goodafternoon.png" alt="Good afternoon">
            </div>

                        <p class="pronunciation">/ɡʊd ˌɑːftərˈnuːn/</p>

            <button class="listen" onclick="speak('Good afternoon')">
                🔊 Listen
            </button>
        </div>

        <!-- Good evening -->
        <div class="card">
            <div class="picture">
                <img src="./images/goodevening.png" alt="Good evening">
            </div>

            
            <p class="pronunciation">/ɡʊd ˈiːvnɪŋ/</p>

            <button class="listen" onclick="speak('Good evening')">
                🔊 Listen
            </button>
        </div>

        <!-- Good night -->
        <div class="card">
            <div class="picture">
                <img src="./images/goodnight.png" alt="Good night">
            </div>

            
            <p class="pronunciation">/ɡʊd naɪt/</p>

            <button class="listen" onclick="speak('Good night')">
                🔊 Listen
            </button>
        </div>

        <!-- Goodbye -->
        <div class="card">
            <div class="picture">
                <img src="./images/goodbye.png" alt="Goodbye">
            </div>

            
            <p class="pronunciation">/ˌɡʊdˈbaɪ/</p>

            <button class="listen" onclick="speak('Goodbye')">
                🔊 Listen
            </button>
        </div>

    </div>

    <button class="print" onclick="window.print()">
        🖨️ Print Flashcards
    </button>

    <a class="back" href="sequence1.html">
        ← Back to Sequence 1
    </a>

    <script>
        function speak(word) {
            const speech = new SpeechSynthesisUtterance(word);

            speech.lang = "en-US";
            speech.rate = 0.8;

            window.speechSynthesis.speak(speech);
        }
    </script>

</body>
</html>
