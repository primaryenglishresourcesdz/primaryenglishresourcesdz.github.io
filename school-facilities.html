<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Facilities - 4AP</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f7ff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 320px);
            justify-content: center;
            gap: 40px;
            margin-top: 40px;
        }

        .card {
            background-color: white;
            border-radius: 15px;
            padding: 15px;
            width: 320px;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .card img {
            width: 280px;
            height: 280px;
            object-fit: contain;
            border-radius: 10px;
        }

        .card h2 {
            font-size: 22px;
            margin: 15px 0;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background-color: #4a90e2;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #357abd;
        }

        .print-button {
            display: inline-block;
            margin: 30px 10px 0;
            padding: 12px 22px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .back-button {
            margin: 20px auto 0;
            display: block;
            width: fit-content;
            text-decoration: none;
            background-color: #555;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
        }

        @media (max-width: 1050px) {
            .cards {
                grid-template-columns: repeat(2, 320px);
                gap: 25px;
            }
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: minmax(0, 320px);
                gap: 25px;
            }

            .card {
                max-width: 100%;
            }

            .card img {
                max-width: 100%;
            }
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }

            body {
                margin: 0;
                padding: 0;
                background: white;
            }

            h1,
            .card h2,
            .card button,
            .print-button,
            .back-button {
                display: none !important;
            }

            .cards {
                display: block;
                margin: 0;
                padding: 0;
            }

            .card {
                box-sizing: border-box;
                width: 210mm;
                height: 297mm;
                margin: 0;
                padding: 10mm;
                display: flex;
                align-items: center;
                justify-content: center;
                background: white;
                border-radius: 0;
                box-shadow: none;
                break-after: page;
                page-break-after: always;
            }

            .card:last-child {
                break-after: auto;
                page-break-after: auto;
            }

            .card img {
                display: block;
                width: 190mm;
                height: 270mm;
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <h1>School Facilities</h1>

    <div class="cards">

        <div class="card">
            <img src="images/classroom.png" alt="Classroom">
           
            <button onclick="speak('Classroom')">Listen 🔊</button>
        </div>

        <div class="card">
            <img src="images/library.png" alt="Library">
                       <button onclick="speak('Library')">Listen 🔊</button>
        </div>

        <div class="card">
            <img src="images/playground.png" alt="Playground">
            
            <button onclick="speak('Playground')">Listen 🔊</button>
        </div>

        <div class="card">
            <img src="images/schoolyard.png" alt="School Yard">
            
            <button onclick="speak('School Yard')">Listen 🔊</button>
        </div>

        <div class="card">
            <img src="images/canteen.png" alt="Canteen">
            
            <button onclick="speak('Canteen')">Listen 🔊</button>
        </div>

        <div class="card">
            <img src="images/computerroom.png" alt="Computer Room">
                        <button onclick="speak('Computer Room')">Listen 🔊</button>
        </div>

        <div class="card">
            <img src="images/sciencelab.png" alt="Science Lab">
           
            <button onclick="speak('Science Lab')">Listen 🔊</button>
        </div>

        <div class="card">
            <img src="images/teachersroom.png" alt="Teachers' Room">
                        <button onclick="speak('Teachers Room')">Listen 🔊</button>
        </div>

        <div class="card">
            <img src="images/headmasteroffice.png" alt="Headmaster's Office">
            
            <button onclick="speak('Headmaster Office')">Listen 🔊</button>
        </div>

        <div class="card">
            <img src="images/lavatory.png" alt="Lavatory">
            
            <button onclick="speak('Lavatory')">Listen 🔊</button>
        </div>

    </div>

    <button class="print-button" onclick="window.print()">
        🖨️ Print Flashcards
    </button>

    <a href="4ap-sequence2.html" class="back-button">
        ← Back to Sequence 02
    </a>

    <script>
        function speak(text) {
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = "en-GB";
            speech.rate = 0.8;
            speechSynthesis.speak(speech);
        }
    </script>

</body>
</html>
