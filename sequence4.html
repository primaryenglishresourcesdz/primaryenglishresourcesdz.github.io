<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3AP - Sequence 04</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7ff;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #333;
        }

        .resources {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .resource-card {
            background: white;
            padding: 25px;
            width: 220px;
            border-radius: 15px;
            color: #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .resource-card:hover {
            transform: translateY(-5px);
        }

        .icon {
            font-size: 40px;
        }
.icon img {
    width: 200px;
    height: 200px;
    object-fit: contain;
}

        .view-button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: green;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .view-button:hover {
            background: #555;
        }

        .back-button {
            display: inline-block;
            margin-top: 35px;
            text-decoration: none;
            padding: 12px 20px;
            background: #333;
            color: white;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>3rd Year Primary – Sequence 04</h1>
    <p>My Playtime</p>

    <div class="resources">

        <div class="resource-card">
            <div class="icon">
            <img src="images/toys.png" alt="Toys">
            </div>
            <h2>Toys</h2>
            <p>Learn the names of toys</p>
            <a href="toys.html" class="view-button">
                View Resources
            </a>
        </div>

    </div>

    <a href="3ap.html" class="back-button">
        ← Back to 3AP
    </a>

</body>
</html>
