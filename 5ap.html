<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5th Year Primary English Resources</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #fff0f6;
            color: #333;
        }

        header {
            background-color: #d63384;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin-top: 10px;
            font-size: 17px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .sequences {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .sequence-card {
            background-color: white;
            padding: 30px 20px;
            border-radius: 15px;
            text-align: center;
            text-decoration: none;
            color: #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .sequence-card:hover {
            transform: translateY(-5px);
        }

        .sequence-card .icon {
            margin-bottom: 15px;
        }

        .sequence-card .icon img {
            width: 200px;
            height: 200px;
            object-fit: contain;
        }

        .sequence-card h2 {
            margin: 10px 0;
            font-size: 22px;
        }

        .sequence-card p {
            color: #666;
        }

        .back-button {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            padding: 12px 22px;
            background-color: #d63384;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 50px;
            background-color: #fce4ec;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>📙 5th Year Primary School</h1>
        <p>English Teacher Resources</p>
    </header>

    <div class="container">

        <div class="sequences">

            <a href="5apsequence1.html" class="sequence-card">
                <div class="icon">
                    <img src="images/sequence1.png" alt="Sequence 1">
                </div>
                <h2>Jobs, Occupations and Hobbies</h2>
            </a>

            <a href="5apsequence2.html" class="sequence-card">
                <div class="icon">
                    <img src="images/sequence2.png" alt="Sequence 2">
                </div>
                <h2>My Hometown</h2>
                
            </a>

            <a href="5apsequence3.html" class="sequence-card">
                <div class="icon">
                    <img src="images/sequence3.png" alt="Sequence 3">
                </div>
                <h2>Holidays and Travelling</h2>
                
            </a>

        </div>

        <a href="index.html" class="back-button">← Back to Home</a>

    </div>

    <footer>
        <p>📚 Primary School English Teacher Resources</p>
    </footer>

</body>
</html>
